<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gaincoon</title>
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#0d0d0f" />
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #17171b;
    --border: #2a2a30;
    --text: #f2f2f2;
    --muted: #8a8a92;
    --accent: #ff6b35;
    --danger: #ff4d4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 1.2rem; margin: 0; display: flex; align-items: center; gap: 8px; }
  header h1 img { height: 28px; width: auto; display: block; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-top: 40px;
  }
  .card h2 { margin-top: 0; font-size: 1.1rem; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 14px 0 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1rem;
  }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: var(--accent);
    color: #111;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  button.link {
    background: none;
    color: var(--muted);
    text-decoration: underline;
    font-weight: 400;
    margin-top: 12px;
  }
  .error { color: var(--danger); font-size: 0.85rem; margin-top: 12px; min-height: 1em; }
  .empty {
    text-align: center;
    color: var(--muted);
    margin-top: 60px;
    max-width: 320px;
  }
  #logout { width: auto; margin: 0; padding: 8px 14px; font-size: 0.85rem; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .hidden { display: none; }

  body.has-nav main { padding-bottom: 112px; }
  #bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 0 calc(22px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  #bottom-nav.hidden { display: none; }
  .nav-btn {
    flex: 1;
    width: auto;
    margin: 0;
    padding: 6px 4px 2px;
    background: none;
    border: none;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 0.72rem;
    cursor: pointer;
  }
  .nav-btn svg { width: 24px; height: 24px; fill: currentColor; }
  .nav-btn.active { color: var(--accent); }

  select {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1rem;
  }
  .dashboard-inner { width: 100%; max-width: 480px; }
  .day-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .day-header { display: flex; justify-content: space-between; align-items: center; }
  .day-header h3 { margin: 0; font-size: 1rem; }
  .icon-btn {
    width: auto;
    margin: 0;
    padding: 2px 8px;
    background: transparent;
    color: var(--muted);
    border: none;
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
  }
  .exercise-row { border-top: 1px solid var(--border); padding: 10px 0; }
  .exercise-main { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .exercise-name { flex: 1; }
  .exercise-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .btn-small { width: auto; margin: 0; padding: 6px 12px; font-size: 0.85rem; }
  .feeling-group { display: flex; gap: 6px; margin-top: 6px; }
  .feeling-btn {
    flex: 1;
    width: auto;
    margin: 0;
    padding: 8px 4px;
    font-size: 0.78rem;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .feeling-btn.active { background: var(--accent); color: #111; border-color: var(--accent); }
  .preset-hint { color: var(--muted); font-size: 0.85rem; margin: 4px 0 10px; }

  .onboarding-choices { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .choice-btn {
    width: 100%;
    margin: 0;
    padding: 12px 14px;
    text-align: left;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 500;
  }
  .choice-btn.active { background: var(--accent); color: #111; border-color: var(--accent); }
  #onboarding-next-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .onboarding-progress-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
  .onboarding-progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
  #onboarding-progress-bar-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.25s ease; }
  .onboarding-nav-row { display: flex; gap: 10px; }
  .onboarding-nav-row button { margin-top: 20px; }
  #onboarding-back-btn { flex: 0 0 auto; width: auto; padding: 12px 18px; }
  #onboarding-next-btn { flex: 1; }
  .recurring-session-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .recurring-session-row .recurring-session-name { font-weight: 600; }
  .recurring-session-row .recurring-session-meta { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
  .recurring-session-row .exercise-actions { flex-shrink: 0; }
  #recurring-session-form-card { margin-top: 16px; }
  #recurring-session-intensity-group { margin-top: 6px; }
  .limitation-detail-block { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .limitation-detail-block .choice-btn { font-size: 0.85rem; padding: 10px 12px; }
  .limitation-detail-block label { margin: 12px 0 6px; }
  textarea.limitation-note {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9rem;
    font-family: inherit;
    resize: vertical;
    min-height: 60px;
  }
  .limitation-disclaimer { margin-top: 20px; font-size: 0.78rem; line-height: 1.4; }
  .add-exercise-form { margin-top: 10px; }
  .add-exercise-form input { font-size: 0.9rem; padding: 8px 10px; }
  .muted { color: var(--muted); font-size: 0.85rem; }

  .session-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    font-weight: 600;
  }
  #session-card { max-width: none; margin-top: 0; }
  .logged-set {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  #session-set-form { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }

  #spinner-overlay {
    position: fixed;
    inset: 0;
    background: rgba(13, 13, 15, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  #spinner-overlay img { width: 120px; height: 120px; }
  #spinner-overlay.hidden { display: none; }

  #auth-intro {
    position: relative;
    display: flex;
    justify-content: center;
    width: 100%;
  }
  #auth-intro #auth-view { margin-top: 150px; }
  #wave-animation {
    /* Der Waschbär-Inhalt in der 512x512-Canvas hat oben/unten transparenten Rand
       (über alle 18 Frames gemessen: y 86–459). Container zeigt nur diesen Bereich,
       damit kein leerer Rand zwischen Waschbär und Card entsteht. */
    position: absolute;
    bottom: 100%;
    left: 50%;
    width: 220px;
    height: 160px;
    overflow: hidden;
    transform: translateX(-50%) translateY(165px);
    z-index: 2;
    transition: opacity 0.4s ease;
  }
  #wave-animation.wave-fade { opacity: 0; }
  #wave-animation img { position: absolute; width: 220px; height: 220px; top: -37px; left: 0; display: block; }
</style>
</head>
<body>

<div id="spinner-overlay" class="hidden">
  <img src="/gaincoon-spinner.webp" alt="Lädt…" />
</div>

<header id="app-header" class="hidden">
  <h1><img src="/gaincoon-logo-horizontal.png" alt="Gaincoon" /> · <span id="user-name"></span></h1>
  <div class="header-actions">
    <button id="logout">Abmelden</button>
  </div>
</header>

<main>
  <div id="auth-intro">
    <section id="auth-view" class="card">
      <h2 id="auth-title">Anmelden</h2>
      <form id="auth-form">
        <div id="name-field" class="hidden">
          <label for="name">Name</label>
          <input id="name" type="text" autocomplete="name" />
        </div>
        <label for="email">E-Mail</label>
        <input id="email" type="email" required autocomplete="email" />
        <label for="password">Passwort</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <button type="submit" id="auth-submit">Anmelden</button>
        <p class="error" id="auth-error"></p>
      </form>
      <button class="link" id="auth-toggle">Noch kein Konto? Registrieren</button>
    </section>

    <div id="wave-animation" class="hidden">
      <img id="wave-img" src="/gaincoon-adonis-login-animation-clean.webp" alt="Gaincoon Waschbär posiert über der Login-Maske" />
    </div>
  </div>

  <section id="onboarding-view" class="card hidden">
    <div id="onboarding-progress-label" class="onboarding-progress-label hidden"></div>
    <div id="onboarding-progress-bar" class="onboarding-progress-bar hidden">
      <div id="onboarding-progress-bar-fill"></div>
    </div>
    <h2 id="onboarding-step-title"></h2>
    <p id="onboarding-step-text" class="muted"></p>
    <div id="onboarding-choices" class="onboarding-choices hidden"></div>

    <div id="recurring-sessions-extra" class="hidden">
      <div id="recurring-sessions-list"></div>
      <button type="button" id="recurring-session-add-btn" class="btn-small secondary">+ Einheit hinzufügen</button>

      <div id="recurring-session-form-card" class="card hidden">
        <h2 id="recurring-session-form-title">Neue Einheit</h2>
        <label for="recurring-session-name">Name</label>
        <input id="recurring-session-name" type="text" list="recurring-session-suggestions" placeholder="z.B. BodyPump" />
        <datalist id="recurring-session-suggestions"></datalist>
        <label for="recurring-session-category">Kategorie</label>
        <select id="recurring-session-category"></select>
        <label for="recurring-session-weekday">Wochentag</label>
        <select id="recurring-session-weekday"></select>
        <label for="recurring-session-duration">Dauer</label>
        <select id="recurring-session-duration"></select>
        <label>Intensität</label>
        <div class="feeling-group" id="recurring-session-intensity-group"></div>
        <label for="recurring-session-time">Uhrzeit (optional)</label>
        <input id="recurring-session-time" type="time" />
        <button type="button" id="recurring-session-save-btn">Speichern</button>
        <button type="button" class="link" id="recurring-session-cancel-btn">Abbrechen</button>
        <p class="error" id="recurring-session-form-error"></p>
      </div>
    </div>

    <div class="onboarding-nav-row">
      <button type="button" id="onboarding-back-btn" class="secondary btn-small hidden">Zurück</button>
      <button type="button" id="onboarding-next-btn">Weiter</button>
    </div>
  </section>

  <section id="dashboard-view" class="hidden">
    <div class="dashboard-inner">
      <div id="days-list"></div>

      <div id="empty-state" class="empty hidden">
        <p>Noch keine Trainingstage angelegt.</p>
      </div>

      <button type="button" id="add-day-btn" class="secondary">+ Trainingstag</button>

      <div id="add-day-card" class="card hidden">
        <h2>Neuer Trainingstag</h2>
        <form id="add-day-form">
          <label for="day-weekday">Wochentag</label>
          <select id="day-weekday"></select>
          <label for="day-name">Name (optional)</label>
          <input id="day-name" type="text" placeholder="z.B. Push Day" />
          <button type="submit">Speichern</button>
          <button type="button" class="link" id="day-cancel">Abbrechen</button>
          <p class="error" id="day-form-error"></p>
        </form>
      </div>
    </div>
  </section>

  <section id="settings-view" class="hidden">
    <div class="dashboard-inner">
      <h2>Einstellungen</h2>
      <button type="button" id="restart-onboarding-btn" class="secondary">Onboarding neu starten</button>
    </div>
  </section>

  <section id="session-view" class="hidden">
    <div class="dashboard-inner">
      <div class="session-header">
        <span id="session-day-name"></span>
        <span id="session-progress" class="muted"></span>
      </div>
      <div class="card" id="session-card">
        <h2 id="session-exercise-name"></h2>
        <div id="session-sets-list"></div>
        <div id="session-set-form">
          <p class="preset-hint" id="session-preset-hint"></p>
          <label for="session-weight">Gewicht (kg)</label>
          <input type="number" step="0.5" min="0" id="session-weight" />
          <label for="session-reps">Wiederholungen</label>
          <input type="number" min="0" id="session-reps" />
          <label>Gefühl</label>
          <div class="feeling-group" id="session-feeling-group">
            <button type="button" class="feeling-btn" data-feeling="too_light">Zu leicht</button>
            <button type="button" class="feeling-btn" data-feeling="comfortable">Passt</button>
            <button type="button" class="feeling-btn" data-feeling="too_heavy">Zu schwer</button>
          </div>
          <button type="button" id="session-add-set-btn">Satz speichern</button>
          <p class="error" id="session-set-error"></p>
        </div>
        <button type="button" id="session-next-btn" class="secondary">Nächste Übung</button>
        <button type="button" class="link" id="session-cancel-btn">Training abbrechen</button>
      </div>
    </div>
  </section>
</main>

<nav id="bottom-nav" class="hidden">
  <button type="button" class="nav-btn" data-nav="dashboard">
    <svg viewBox="0 0 24 24"><path d="M20.57,14.86L22,13.43L20.57,12L17,15.57L8.43,7L12,3.43L10.57,2L9.14,3.43L7.71,2L5.57,4.14L4.14,2.71L2.71,4.14L4.14,5.57L2,7.71L3.43,9.14L2,10.57L3.43,12L7,8.43L15.57,17L12,20.57L13.43,22L14.86,20.57L16.29,22L18.43,19.86L19.86,21.29L21.29,19.86L19.86,18.43L22,16.29L20.57,14.86Z" /></svg>
    <span>Training</span>
  </button>
  <button type="button" class="nav-btn" data-nav="settings">
    <svg viewBox="0 0 24 24"><path d="M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8M12,10A2,2 0 0,0 10,12A2,2 0 0,0 12,14A2,2 0 0,0 14,12A2,2 0 0,0 12,10M10,22C9.75,22 9.54,21.82 9.5,21.58L9.13,18.93C8.5,18.68 7.96,18.34 7.44,17.94L4.95,18.95C4.73,19.03 4.46,18.95 4.34,18.73L2.34,15.27C2.21,15.05 2.27,14.78 2.46,14.63L4.57,12.97L4.5,12L4.57,11L2.46,9.37C2.27,9.22 2.21,8.95 2.34,8.73L4.34,5.27C4.46,5.05 4.73,4.96 4.95,5.05L7.44,6.05C7.96,5.66 8.5,5.32 9.13,5.07L9.5,2.42C9.54,2.18 9.75,2 10,2H14C14.25,2 14.46,2.18 14.5,2.42L14.87,5.07C15.5,5.32 16.04,5.66 16.56,6.05L19.05,5.05C19.27,4.96 19.54,5.05 19.66,5.27L21.66,8.73C21.79,8.95 21.73,9.22 21.54,9.37L19.43,11L19.5,12L19.43,13L21.54,14.63C21.73,14.78 21.79,15.05 21.66,15.27L19.66,18.73C19.54,18.95 19.27,19.04 19.05,18.95L16.56,17.95C16.04,18.34 15.5,18.68 14.87,18.93L14.5,21.58C14.46,21.82 14.25,22 14,22H10M11.25,4L10.88,6.61C9.68,6.86 8.62,7.5 7.85,8.39L5.44,7.35L4.69,8.65L6.8,10.2C6.4,11.37 6.4,12.64 6.8,13.8L4.68,15.36L5.43,16.66L7.86,15.62C8.63,16.5 9.68,17.14 10.87,17.38L11.24,20H12.76L13.13,17.39C14.32,17.14 15.37,16.5 16.14,15.62L18.57,16.66L19.32,15.36L17.2,13.81C17.6,12.64 17.6,11.37 17.2,10.2L19.31,8.65L18.56,7.35L16.15,8.39C15.38,7.5 14.32,6.86 13.12,6.62L12.75,4H11.25Z" /></svg>
    <span>Einstellungen</span>
  </button>
</nav>

<script>
  const authView = document.getElementById("auth-view");
  const dashboardView = document.getElementById("dashboard-view");
  const settingsView = document.getElementById("settings-view");
  const appHeader = document.getElementById("app-header");
  const bottomNav = document.getElementById("bottom-nav");
  const navBtns = document.querySelectorAll(".nav-btn");
  const authForm = document.getElementById("auth-form");
  const authTitle = document.getElementById("auth-title");
  const authToggle = document.getElementById("auth-toggle");
  const authSubmit = document.getElementById("auth-submit");
  const authError = document.getElementById("auth-error");
  const nameField = document.getElementById("name-field");
  const userNameEl = document.getElementById("user-name");
  const logoutBtn = document.getElementById("logout");
  const restartOnboardingBtn = document.getElementById("restart-onboarding-btn");
  const waveAnimation = document.getElementById("wave-animation");
  const waveImg = document.getElementById("wave-img");

  const onboardingView = document.getElementById("onboarding-view");
  const onboardingProgressLabel = document.getElementById("onboarding-progress-label");
  const onboardingProgressBar = document.getElementById("onboarding-progress-bar");
  const onboardingProgressBarFill = document.getElementById("onboarding-progress-bar-fill");
  const onboardingStepTitle = document.getElementById("onboarding-step-title");
  const onboardingStepText = document.getElementById("onboarding-step-text");
  const onboardingChoices = document.getElementById("onboarding-choices");
  const onboardingBackBtn = document.getElementById("onboarding-back-btn");
  const onboardingNextBtn = document.getElementById("onboarding-next-btn");

  const recurringSessionsExtra = document.getElementById("recurring-sessions-extra");
  const recurringSessionsList = document.getElementById("recurring-sessions-list");
  const recurringSessionAddBtn = document.getElementById("recurring-session-add-btn");
  const recurringSessionFormCard = document.getElementById("recurring-session-form-card");
  const recurringSessionFormTitle = document.getElementById("recurring-session-form-title");
  const recurringSessionNameInput = document.getElementById("recurring-session-name");
  const recurringSessionSuggestions = document.getElementById("recurring-session-suggestions");
  const recurringSessionCategorySelect = document.getElementById("recurring-session-category");
  const recurringSessionWeekdaySelect = document.getElementById("recurring-session-weekday");
  const recurringSessionDurationSelect = document.getElementById("recurring-session-duration");
  const recurringSessionIntensityGroup = document.getElementById("recurring-session-intensity-group");
  const recurringSessionTimeInput = document.getElementById("recurring-session-time");
  const recurringSessionSaveBtn = document.getElementById("recurring-session-save-btn");
  const recurringSessionCancelBtn = document.getElementById("recurring-session-cancel-btn");
  const recurringSessionFormError = document.getElementById("recurring-session-form-error");

  const daysList = document.getElementById("days-list");
  const emptyState = document.getElementById("empty-state");
  const addDayBtn = document.getElementById("add-day-btn");
  const addDayCard = document.getElementById("add-day-card");
  const addDayForm = document.getElementById("add-day-form");
  const dayWeekdaySelect = document.getElementById("day-weekday");
  const dayNameInput = document.getElementById("day-name");
  const dayCancelBtn = document.getElementById("day-cancel");
  const dayFormError = document.getElementById("day-form-error");

  const WEEKDAY_ORDER = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
  const WEEKDAY_LABELS = {
    mon: "Montag", tue: "Dienstag", wed: "Mittwoch", thu: "Donnerstag",
    fri: "Freitag", sat: "Samstag", sun: "Sonntag",
  };
  const FEELING_LABELS = { too_light: "Zu leicht", comfortable: "Passt", too_heavy: "Zu schwer" };

  for (const wd of WEEKDAY_ORDER) {
    const opt = document.createElement("option");
    opt.value = wd;
    opt.textContent = WEEKDAY_LABELS[wd];
    dayWeekdaySelect.appendChild(opt);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  const spinnerOverlay = document.getElementById("spinner-overlay");
  let activeRequests = 0;

  function showSpinner() {
    activeRequests++;
    spinnerOverlay.classList.remove("hidden");
  }

  function hideSpinner() {

  function playLoginIntro() {

  }

  async function apiFetch(path, options = {}) {
    const token = localStorage.getItem("token");
    showSpinner();
    try {
      const res = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...(options.headers || {}),
        },
      });
      if (res.status === 401) {
        const data = await res.json().catch(() => null);
        if (token) doLogout();
        throw new Error(data?.error || "Nicht angemeldet");
      }
      if (res.status === 204) return null;
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(data?.error || "Fehler");
      return data;
    } finally {
      hideSpinner();
    }
  }

    const endpoint = mode === "register" ? "/api/register" : "/api/login";
    const body = mode === "register" ? { name, email, password } : { email, password };

    try {
      const data = await apiFetch(endpoint, { method: "POST", body: JSON.stringify(body) });
      localStorage.setItem("token", data.token);

  function renderOnboardingStep() {
    const step = ONBOARDING_STEPS[onboardingStep] || ONBOARDING_STEPS[0];
    onboardingStepTitle.textContent = step.title;
    onboardingStepText.textContent = step.text;
    onboardingNextBtn.textContent =
      onboardingStep === ONBOARDING_STEPS.length - 1 ? "Fertig" : "Weiter";

    onboardingBackBtn.classList.toggle("hidden", onboardingStep === 0);

    if (onboardingStep === 0) {
      onboardingProgressLabel.classList.add("hidden");
      onboardingProgressBar.classList.add("hidden");
    } else {
      const visible = visibleStepIndices();
      const position = Math.max(visible.indexOf(onboardingStep) + 1, 1);
      onboardingProgressLabel.textContent = `Frage ${position} von ${visible.length}`;
      onboardingProgressBarFill.style.width = `${(position / visible.length) * 100}%`;
      onboardingProgressLabel.classList.remove("hidden");
      onboardingProgressBar.classList.remove("hidden");
    }

    if (step.type === "choice") {
      onboardingChoices.classList.remove("hidden");
      onboardingChoices.innerHTML = "";
      step.choices.forEach((choice) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-btn";
        btn.textContent = choice.label;
        btn.classList.toggle("active", onboardingData[step.key] === choice.value);
        btn.addEventListener("click", () => {
          onboardingData[step.key] = choice.value;
          if (choice.setData) Object.assign(onboardingData, choice.setData);
          renderOnboardingStep();
        });
        onboardingChoices.appendChild(btn);
      });
      onboardingNextBtn.disabled = !onboardingData[step.key];
    } else if (step.type === "multi-choice") {
      const minCount = step.minCountKey ? onboardingData[step.minCountKey] || 1 : 1;
      const selected = Array.isArray(onboardingData[step.key]) ? onboardingData[step.key] : [];
      if (step.minCountKey) {
        onboardingStepText.textContent = `Wähle mindestens ${minCount} Tag${minCount === 1 ? "" : "e"} aus.`;
      } else {
        onboardingStepText.textContent = step.text;
      }
      onboardingChoices.classList.remove("hidden");
      onboardingChoices.innerHTML = "";
      step.choices.forEach((choice) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-btn";
        btn.textContent = choice.label;
        btn.classList.toggle("active", selected.includes(choice.value));
        btn.addEventListener("click", () => {
          const current = Array.isArray(onboardingData[step.key]) ? onboardingData[step.key] : [];
          const idx = current.indexOf(choice.value);
          if (idx === -1) current.push(choice.value);
          else current.splice(idx, 1);
          onboardingData[step.key] = current;
          renderOnboardingStep();
        });
        onboardingChoices.appendChild(btn);
      });
      onboardingNextBtn.disabled = selected.length < minCount;
    } else if (step.type === "limitations") {
      onboardingChoices.classList.remove("hidden");
      onboardingChoices.innerHTML = "";

      const hasLimitations = onboardingData.hasLimitations;

      const gateWrap = document.createElement("div");
      gateWrap.className = "onboarding-choices";

      const noBtn = document.createElement("button");
      noBtn.type = "button";
      noBtn.className = "choice-btn";
      noBtn.textContent = "Nein, ich kann ohne Einschränkungen trainieren";
      noBtn.classList.toggle("active", hasLimitations === false);
      noBtn.addEventListener("click", () => {
        onboardingData.hasLimitations = false;
        onboardingData.limitationAreas = [];
        onboardingData.limitationDetails = {};
        renderOnboardingStep();
      });
      gateWrap.appendChild(noBtn);

      const yesBtn = document.createElement("button");
      yesBtn.type = "button";
      yesBtn.className = "choice-btn";
      yesBtn.textContent = "Ja, das möchte ich angeben";
      yesBtn.classList.toggle("active", hasLimitations === true);
      yesBtn.addEventListener("click", () => {
        onboardingData.hasLimitations = true;
        if (!Array.isArray(onboardingData.limitationAreas)) onboardingData.limitationAreas = [];
        if (!onboardingData.limitationDetails) onboardingData.limitationDetails = {};
        renderOnboardingStep();
      });
      gateWrap.appendChild(yesBtn);

      onboardingChoices.appendChild(gateWrap);

      let allSelectedAreasHandled = true;

      if (hasLimitations === true) {
        const selectedAreas = Array.isArray(onboardingData.limitationAreas) ? onboardingData.limitationAreas : [];

        const areasWrap = document.createElement("div");
        areasWrap.className = "onboarding-choices";
        areasWrap.style.marginTop = "16px";
        LIMITATION_AREAS.forEach((area) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "choice-btn";
          btn.textContent = area.label;
          btn.classList.toggle("active", selectedAreas.includes(area.value));
          btn.addEventListener("click", () => {
            const current = Array.isArray(onboardingData.limitationAreas) ? onboardingData.limitationAreas : [];
            const idx = current.indexOf(area.value);
            if (idx === -1) {
              current.push(area.value);
            } else {
              current.splice(idx, 1);
              delete onboardingData.limitationDetails[area.value];
            }
            onboardingData.limitationAreas = current;
            renderOnboardingStep();
          });
          areasWrap.appendChild(btn);
        });
        onboardingChoices.appendChild(areasWrap);

        selectedAreas.forEach((areaValue) => {
          const area = LIMITATION_AREAS.find((a) => a.value === areaValue);
          if (!area) return;
          const details = onboardingData.limitationDetails[areaValue] || {};
          if (!details.handling) allSelectedAreasHandled = false;

          const block = document.createElement("div");
          block.className = "limitation-detail-block";

          const heading = document.createElement("p");
          heading.className = "muted";
          heading.textContent = `${area.label}: Wie soll Gaincoon damit umgehen?`;
          block.appendChild(heading);

          const handlingWrap = document.createElement("div");
          handlingWrap.className = "onboarding-choices";
          LIMITATION_HANDLING_OPTIONS.forEach((opt) => {
            const hBtn = document.createElement("button");
            hBtn.type = "button";
            hBtn.className = "choice-btn";
            hBtn.textContent = opt.label;
            hBtn.classList.toggle("active", details.handling === opt.value);
            hBtn.addEventListener("click", () => {
              onboardingData.limitationDetails[areaValue] = {
                ...onboardingData.limitationDetails[areaValue],
                handling: opt.value,
              };
              renderOnboardingStep();
            });
            handlingWrap.appendChild(hBtn);
          });
          block.appendChild(handlingWrap);

          const noteLabel = document.createElement("label");
          noteLabel.textContent = "Was sollten wir darüber wissen? (optional)";
          block.appendChild(noteLabel);

          const noteInput = document.createElement("textarea");
          noteInput.className = "limitation-note";
          noteInput.value = details.note || "";
          noteInput.addEventListener("input", () => {
            onboardingData.limitationDetails[areaValue] = {
              ...onboardingData.limitationDetails[areaValue],
              note: noteInput.value,
            };
          });
          block.appendChild(noteInput);

          onboardingChoices.appendChild(block);
        });

        if (selectedAreas.length === 0) allSelectedAreasHandled = false;
      }

      const disclaimer = document.createElement("p");
      disclaimer.className = "muted limitation-disclaimer";
      disclaimer.textContent =
        "Gaincoon ersetzt keine medizinische Beratung. Bei akuten, ungeklärten oder starken Beschwerden solltest du das Training ärztlich oder physiotherapeutisch abklären lassen.";
      onboardingChoices.appendChild(disclaimer);

      onboardingNextBtn.disabled =
        hasLimitations === undefined || (hasLimitations === true && !allSelectedAreasHandled);
    } else if (step.type === "recurring-sessions") {
      onboardingChoices.classList.remove("hidden");
      onboardingChoices.innerHTML = "";

      const hasSessions = onboardingData.hasRecurringSessions;

      const gateWrap = document.createElement("div");
      gateWrap.className = "onboarding-choices";

      const noBtn = document.createElement("button");
      noBtn.type = "button";
      noBtn.className = "choice-btn";
      noBtn.textContent = "Nein";
      noBtn.classList.toggle("active", hasSessions === false);
      noBtn.addEventListener("click", () => {
        onboardingData.hasRecurringSessions = false;
        onboardingData.recurringSessions = [];
        closeRecurringSessionForm();
        renderOnboardingStep();
      });
      gateWrap.appendChild(noBtn);

      const yesBtn = document.createElement("button");
      yesBtn.type = "button";
      yesBtn.className = "choice-btn";
      yesBtn.textContent = "Ja, Einheiten hinzufügen";
      yesBtn.classList.toggle("active", hasSessions === true);
      yesBtn.addEventListener("click", () => {
        onboardingData.hasRecurringSessions = true;
        if (!Array.isArray(onboardingData.recurringSessions)) onboardingData.recurringSessions = [];
        renderOnboardingStep();
      });
      gateWrap.appendChild(yesBtn);

      onboardingChoices.appendChild(gateWrap);

      recurringSessionsExtra.classList.toggle("hidden", hasSessions !== true);
      if (hasSessions === true) {
        renderRecurringSessionsList();
      } else {
        closeRecurringSessionForm();
      }

      const sessionsCount = Array.isArray(onboardingData.recurringSessions)
        ? onboardingData.recurringSessions.length
        : 0;
      onboardingNextBtn.disabled = hasSessions === undefined || (hasSessions === true && sessionsCount === 0);
    } else {
      onboardingChoices.classList.add("hidden");
      onboardingChoices.innerHTML = "";
      recurringSessionsExtra.classList.add("hidden");
      onboardingNextBtn.disabled = false;
    }
  }

  function nextVisibleStepIndex(fromIndex) {
    let idx = fromIndex + 1;
    while (idx < ONBOARDING_STEPS.length && ONBOARDING_STEPS[idx].skipIf?.(onboardingData)) {
      idx++;
    }
    return idx;
  }

  function prevVisibleStepIndex(fromIndex) {
    let idx = fromIndex - 1;
    while (idx > 0 && ONBOARDING_STEPS[idx].skipIf?.(onboardingData)) {
      idx--;
    }
    return idx;
  }

  // Für die Fortschrittsanzeige: alle aktuell sichtbaren (nicht per skipIf
  // übersprungenen) Schritt-Indizes außer der Begrüßung (Index 0), die keine
  // echte Frage ist. Ändert sich dynamisch mit onboardingData (z.B. wenn ein
  // Studio-Besuch die Geräteauswahl überspringt).
  function visibleStepIndices() {
    const indices = [];
    for (let i = 1; i < ONBOARDING_STEPS.length; i++) {
      if (!ONBOARDING_STEPS[i].skipIf?.(onboardingData)) indices.push(i);
    }
    return indices;
  }

  async function persistOnboardingStep(step, completed) {
    const data = Object.keys(onboardingData).length ? onboardingData : undefined;
    const result = await apiFetch("/api/onboarding", {
      method: "PATCH",
      body: JSON.stringify({ step, completed, data }),
    });
    const storedUser = JSON.parse(localStorage.getItem("user"));
    storedUser.onboarding_status = result.onboarding_status;
    storedUser.onboarding_step = result.onboarding_step;
    storedUser.onboarding_data = result.onboarding_data;
    localStorage.setItem("user", JSON.stringify(storedUser));
    onboardingData = result.onboarding_data || {};
    return result;
  }

  onboardingBackBtn.addEventListener("click", async () => {
    if (onboardingStep === 0) return;
    try {
      const result = await persistOnboardingStep(prevVisibleStepIndex(onboardingStep), false);
      onboardingStep = result.onboarding_step;
      renderOnboardingStep();
    } catch (err) {
      console.error(err);
    }
  });

  onboardingNextBtn.addEventListener("click", async () => {
    const isLast = onboardingStep === ONBOARDING_STEPS.length - 1;
    try {
      const result = await persistOnboardingStep(
        isLast ? onboardingStep : nextVisibleStepIndex(onboardingStep),
        isLast
      );
      if (isLast) {
        showDashboard();
      } else {
        onboardingStep = result.onboarding_step;
        renderOnboardingStep();
      }
    } catch (err) {
      console.error(err);
    }
  });

  restartOnboardingBtn.addEventListener("click", async () => {
    try {
      const result = await apiFetch("/api/onboarding", {
        method: "PATCH",
        body: JSON.stringify({ step: 0, completed: false }),
      });
      const storedUser = JSON.parse(localStorage.getItem("user"));
      storedUser.onboarding_status = result.onboarding_status;
      storedUser.onboarding_step = result.onboarding_step;
      storedUser.onboarding_data = result.onboarding_data;
      localStorage.setItem("user", JSON.stringify(storedUser));
      showOnboarding(storedUser);
    } catch (err) {
      console.error(err);
    }
  });

  (async function init() {
    const token = localStorage.getItem("token");
    const user = localStorage.getItem("user");
    if (token && user) {
      routeAfterAuth(JSON.parse(user));
    } else {
      playLoginIntro();
    }
  })();

  // ── Trainingstage & Übungen ──────────────────────────────────────────────

  let days = [];

  async function loadDays() {
    try {
      days = await apiFetch("/api/workout-days");
      renderDays();
    } catch (err) {
      console.error(err);
    }
  }

  function renderDays() {
    daysList.innerHTML = "";
    emptyState.classList.toggle("hidden", days.length > 0);
    const sorted = [...days].sort(
      (a, b) => WEEKDAY_ORDER.indexOf(a.weekday) - WEEKDAY_ORDER.indexOf(b.weekday)
    );
    for (const day of sorted) {
      const card = document.createElement("div");
      card.className = "day-card";
      card.dataset.dayId = day.id;
      card.innerHTML = `
        <div class="day-header">
          <h3>${WEEKDAY_LABELS[day.weekday]}${day.name ? " · " + escapeHtml(day.name) : ""}</h3>
          <div class="exercise-actions">
            <button type="button" class="btn-small start-session-btn">Training starten</button>
            <button type="button" class="icon-btn delete-day" title="Trainingstag löschen">×</button>
          </div>
        </div>
        <div class="exercise-list">
          ${day.exercises.map(renderExerciseRow).join("")}
        </div>
        <form class="add-exercise-form">
          <input type="text" class="new-exercise-input" placeholder="+ Übung hinzufügen" required />
        </form>
      `;
      daysList.appendChild(card);
    }
  }

  function renderExerciseRow(ex) {
    return `
      <div class="exercise-row" data-exercise-id="${ex.id}">
        <div class="exercise-main">
          <span class="exercise-name">${escapeHtml(ex.name)}</span>
          <div class="exercise-actions">
            <button type="button" class="icon-btn delete-exercise" title="Übung löschen">×</button>
          </div>
        </div>
      </div>
    `;
  }

  addDayBtn.addEventListener("click", () => {
    dayFormError.textContent = "";
    addDayCard.classList.toggle("hidden");
  });

  dayCancelBtn.addEventListener("click", () => addDayCard.classList.add("hidden"));

  addDayForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    dayFormError.textContent = "";
    try {
      await apiFetch("/api/workout-days", {
        method: "POST",
        body: JSON.stringify({
          weekday: dayWeekdaySelect.value,
          name: dayNameInput.value.trim() || null,
        }),
      });
      dayNameInput.value = "";
      addDayCard.classList.add("hidden");
      await loadDays();
    } catch (err) {
      dayFormError.textContent = err.message;
    }
  });

  daysList.addEventListener("submit", async (e) => {
    if (!e.target.classList.contains("add-exercise-form")) return;
    e.preventDefault();
    const dayId = e.target.closest(".day-card").dataset.dayId;
    const input = e.target.querySelector(".new-exercise-input");
    const name = input.value.trim();
    if (!name) return;
    try {
      await apiFetch(`/api/workout-days/${dayId}/exercises`, {
        method: "POST",
        body: JSON.stringify({ name }),
      });
      await loadDays();
    } catch (err) {
      console.error(err);
    }
  });

  daysList.addEventListener("click", async (e) => {
    if (e.target.closest(".delete-day")) {
      const dayId = e.target.closest(".day-card").dataset.dayId;
      if (!confirm("Trainingstag wirklich löschen?")) return;
      await apiFetch(`/api/workout-days/${dayId}`, { method: "DELETE" });
      await loadDays();
      return;
    }

    if (e.target.closest(".start-session-btn")) {
      const dayId = e.target.closest(".day-card").dataset.dayId;
      await startSession(dayId);
      return;
    }

    const exerciseRow = e.target.closest(".exercise-row");
    if (!exerciseRow) return;
    const exerciseId = exerciseRow.dataset.exerciseId;

    if (e.target.closest(".delete-exercise")) {
      if (!confirm("Übung wirklich löschen?")) return;
      await apiFetch(`/api/exercises/${exerciseId}`, { method: "DELETE" });
      await loadDays();
      return;
    }
  });

  // ── Trainings-Session (Schritt für Schritt: Übung für Übung, Satz für Satz) ──

  const sessionView = document.getElementById("session-view");
  const sessionDayName = document.getElementById("session-day-name");
  const sessionProgress = document.getElementById("session-progress");
  const sessionExerciseName = document.getElementById("session-exercise-name");
  const sessionSetsList = document.getElementById("session-sets-list");
  const sessionPresetHint = document.getElementById("session-preset-hint");
  const sessionWeight = document.getElementById("session-weight");
  const sessionReps = document.getElementById("session-reps");
  const sessionFeelingGroup = document.getElementById("session-feeling-group");
  const sessionAddSetBtn = document.getElementById("session-add-set-btn");
  const sessionSetError = document.getElementById("session-set-error");
  const sessionNextBtn = document.getElementById("session-next-btn");
  const sessionCancelBtn = document.getElementById("session-cancel-btn");

  let session = null;

  async function startSession(dayId) {
    let data;
    try {
      data = await apiFetch(`/api/workout-days/${dayId}/sessions`, { method: "POST" });
    } catch (err) {
      alert(err.message);
      return;
    }
    if (!data.exercises.length) {
      alert("Dieser Trainingstag hat noch keine Übungen. Erst welche hinzufügen.");
      return;
    }
    session = {
      id: data.session.id,
      dayLabel: WEEKDAY_LABELS[data.day.weekday] + (data.day.name ? " · " + escapeHtml(data.day.name) : ""),
      exercises: data.exercises,
      currentIndex: 0,
      setsByExercise: {},
      presetByExercise: {},
    };
    dashboardView.classList.add("hidden");
    appHeader.classList.add("hidden");
    hideBottomNav();
    sessionView.classList.remove("hidden");
    await renderCurrentExercise();
  }

  function endSession() {
    session = null;
    sessionView.classList.add("hidden");
    appHeader.classList.remove("hidden");
    dashboardView.classList.remove("hidden");
    showBottomNav("dashboard");
  }

  async function renderCurrentExercise() {
    const ex = session.exercises[session.currentIndex];
    sessionDayName.innerHTML = session.dayLabel;
    sessionProgress.textContent = `Übung ${session.currentIndex + 1}/${session.exercises.length}`;
    sessionExerciseName.textContent = ex.name;
    sessionSetError.textContent = "";

    if (!session.presetByExercise[ex.id]) {
      try {
        session.presetByExercise[ex.id] = await apiFetch(`/api/exercises/${ex.id}/preset`);
      } catch {
        session.presetByExercise[ex.id] = [];
      }
    }
    if (!session.setsByExercise[ex.id]) session.setsByExercise[ex.id] = [];

    renderLoggedSets();
    renderSetForm();

    sessionNextBtn.textContent =
      session.currentIndex === session.exercises.length - 1 ? "Training abschließen" : "Nächste Übung ›";
  }

  function renderLoggedSets() {
    const ex = session.exercises[session.currentIndex];
    const sets = session.setsByExercise[ex.id];
    sessionSetsList.innerHTML = sets
      .map(
        (s) => `
        <div class="logged-set" data-set-id="${s.id}">
          <span>Satz ${s.set_number} · ${s.weight} kg${s.reps ? " × " + s.reps : ""}${s.feeling ? " · " + FEELING_LABELS[s.feeling] : ""}</span>
          <button type="button" class="icon-btn delete-set" title="Satz löschen">×</button>
        </div>`
      )
      .join("");
  }

  function renderSetForm() {
    const ex = session.exercises[session.currentIndex];
    const nextSetNumber = session.setsByExercise[ex.id].length + 1;
    const preset = session.presetByExercise[ex.id].find((p) => p.set_number === nextSetNumber);
    sessionPresetHint.textContent = preset
      ? `Satz ${nextSetNumber} zuletzt: ${preset.weight} kg${preset.feeling ? " · " + FEELING_LABELS[preset.feeling] : ""}`
      : `Satz ${nextSetNumber} · noch kein Vergleichswert`;
    sessionWeight.value = preset ? preset.weight : "";
    sessionReps.value = preset && preset.reps != null ? preset.reps : "";
    sessionFeelingGroup.querySelectorAll(".feeling-btn").forEach((b) => b.classList.remove("active"));
  }

  sessionFeelingGroup.addEventListener("click", (e) => {
    const btn = e.target.closest(".feeling-btn");
    if (!btn) return;
    sessionFeelingGroup.querySelectorAll(".feeling-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
  });

  sessionAddSetBtn.addEventListener("click", async () => {
    const ex = session.exercises[session.currentIndex];
    const weight = parseFloat(sessionWeight.value);
    if (!weight) {
      sessionSetError.textContent = "Bitte Gewicht eintragen";
      return;
    }
    const setNumber = session.setsByExercise[ex.id].length + 1;
    const activeFeeling = sessionFeelingGroup.querySelector(".feeling-btn.active");
    try {
      const created = await apiFetch(`/api/sessions/${session.id}/sets`, {
        method: "POST",
        body: JSON.stringify({
          exercise_id: ex.id,
          set_number: setNumber,
          weight,
          reps: sessionReps.value ? parseInt(sessionReps.value, 10) : null,
          feeling: activeFeeling ? activeFeeling.dataset.feeling : null,
        }),
      });
      session.setsByExercise[ex.id].push(created);
      sessionSetError.textContent = "";
      renderLoggedSets();
      renderSetForm();
    } catch (err) {
      sessionSetError.textContent = err.message;
    }
  });

  sessionSetsList.addEventListener("click", async (e) => {
    const btn = e.target.closest(".delete-set");
    if (!btn) return;
    const setId = btn.closest(".logged-set").dataset.setId;
    const ex = session.exercises[session.currentIndex];
    try {
      await apiFetch(`/api/sets/${setId}`, { method: "DELETE" });
      session.setsByExercise[ex.id] = session.setsByExercise[ex.id].filter((s) => String(s.id) !== setId);
      renderLoggedSets();
      renderSetForm();
    } catch (err) {
      console.error(err);
    }
  });

  sessionNextBtn.addEventListener("click", async () => {
    if (session.currentIndex < session.exercises.length - 1) {
      session.currentIndex++;
      await renderCurrentExercise();
    } else {
      try {
        await apiFetch(`/api/sessions/${session.id}/complete`, { method: "PATCH" });
      } catch (err) {
        console.error(err);
      }
      endSession();
    }
  });

  sessionCancelBtn.addEventListener("click", () => {
    if (confirm("Training abbrechen? Bereits geloggte Sätze bleiben gespeichert.")) {
      endSession();
    }
  });
</script>
</body>
</html>
